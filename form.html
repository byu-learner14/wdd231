<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Interest Form | WDD 231</title>
  <meta name="description" content="Tell us about your interest in web development courses.">
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <header>
    <h1>WDD 231 - Web Frontend Development I</h1>
    <p>Course Interest Form</p>
  </header>

  <main>
    <form id="interest-form" action="confirmation.html" method="get">
      
      <fieldset>
        <legend>Personal Information</legend>
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
      </fieldset>

      <fieldset>
        <legend>Course Interest</legend>
        
        <label for="course">Which course are you most interested in?</label>
        <select id="course" name="course" required>
          <option value="">-- Select a course --</option>
          <option value="WDD130">WDD 130 - Web Fundamentals</option>
          <option value="WDD131">WDD 131 - Dynamic Web Fundamentals</option>
          <option value="WDD231">WDD 231 - Web Frontend Development I</option>
          <option value="CSE110">CSE 110 - Introduction to Programming</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Additional Information</legend>
        
        <label for="reason">Why are you interested in this course?</label>
        <textarea id="reason" name="reason" rows="4" placeholder="Tell us more..."></textarea>
        
        <p>Preferred Start Date:</p>
        <input type="date" id="startdate" name="startdate">
      </fieldset>

      <button type="submit">Submit Interest Form</button>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Olivia Crawford | WDD 231</p>
  </footer>

  <script src="scripts/form.js" defer></script>
</body>
</html>
